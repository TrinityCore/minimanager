<svg xmlns="http://w3.org" width="380" height="72" viewBox="0 0 380 72">
  <defs>
    <!-- Degradado metálico/helado para las letras principales -->
    <linearGradient id="iceText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a8e6ff"/>
      <stop offset="75%" stop-color="#38a3e0"/>
      <stop offset="100%" stop-color="#174d7a"/>
    </linearGradient>

    <!-- Degradado de nieve y carámbanos -->
    <linearGradient id="icicleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#9be7ff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#3bc9ff" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Degradado dorado WotLK para el subtítulo -->
    <linearGradient id="wotlkGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff099"/>
      <stop offset="50%" stop-color="#ffd100"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>

    <!-- Sombra y brillo glacial -->
    <filter id="frostGlow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020a12" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#5ce1ff" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Texto principal: miniMANAGER -->
  <g filter="url(#frostGlow)">
    <text x="14" y="40" font-family="Trebuchet MS, Verdana, sans-serif" font-weight="900" font-size="33" letter-spacing="1" fill="url(#iceText)" stroke="#092136" stroke-width="1.2">
      <tspan font-size="25" font-weight="700">mini</tspan>MANAGER
    </text>

    <!-- Capa de nieve acumulada y carámbanos cayendo de las letras -->
    <path d="
      M 16,22 Q 24,18 32,22 L 34,30 L 36,22 Q 46,19 56,22 L 58,34 L 61,22 Q 66,20 71,22
      M 74,15 Q 84,11 94,15 L 96,29 L 99,15 Q 108,12 118,15 L 120,36 L 123,15 Q 134,11 144,15
      L 146,27 L 149,15 Q 160,12 172,15 L 175,38 L 178,15 Q 190,11 202,15 L 204,31 L 207,15
      Q 218,12 230,15 L 233,35 L 236,15 Q 248,11 260,15 L 262,28 L 265,15 Q 276,12 288,15
      L 291,37 L 294,15 Q 302,12 310,15
      " fill="none" stroke="url(#icicleGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Estalactitas/gotas de hielo colgando de la parte inferior de las letras -->
    <polygon points="24,40 28,40 26,51" fill="url(#icicleGrad)"/>
    <polygon points="52,40 57,40 54.5,55" fill="url(#icicleGrad)"/>
    <polygon points="82,40 88,40 85,58" fill="url(#icicleGrad)"/>
    <polygon points="114,40 119,40 116.5,52" fill="url(#icicleGrad)"/>
    <polygon points="150,40 156,40 153,60" fill="url(#icicleGrad)"/>
    <polygon points="186,40 191,40 188.5,53" fill="url(#icicleGrad)"/>
    <polygon points="222,40 228,40 225,57" fill="url(#icicleGrad)"/>
    <polygon points="258,40 263,40 260.5,50" fill="url(#icicleGrad)"/>
    <polygon points="292,40 297,40 294.5,54" fill="url(#icicleGrad)"/>
  </g>

  <!-- Subtítulo: for project TRINITYCORE -->
  <text x="16" y="63" font-family="Trebuchet MS, Verdana, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="1.8" fill="url(#wotlkGold)" stroke="#05111c" stroke-width="0.6">
    for project TRINITYCORE
  </text>
</svg>
