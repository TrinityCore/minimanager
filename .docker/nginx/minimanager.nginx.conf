# nginx counterpart of ../apache/minimanager.apache.conf.
# nginx ignores .htaccess files, so the deny rules below are the only thing
# keeping backup/ and SQL dumps off the web. Keep them when adapting this file.
server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php;

    # Keep repo metadata, SQL dumps and backups out of reach.
    # Regex locations match in order, so these must stay above the .php block.
    location ~ ^/(\.git|\.github|\.docker|SQL|backup|doc)(/|$) {
        deny all;
    }
    location ~ \.(sql|md|yml|yaml)$ {
        deny all;
    }

    # Send .php requests to port 9000 of the php-fpm container
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }
}
